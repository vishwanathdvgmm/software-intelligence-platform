version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sip-postgres
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: ${SIP_POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: sip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sip_network

  qdrant:
    image: qdrant/qdrant:v1.11.2
    container_name: sip-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sip_network

volumes:
  postgres_data:
  qdrant_data:

networks:
  sip_network:
    driver: bridge
