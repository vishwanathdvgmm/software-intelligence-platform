[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sip"
version = "0.1.0"
description = "Software Intelligence Platform — adaptive RAG-powered software expertise"
readme = "README.md"
requires-python = "==3.12.10"
license = { text = "Proprietary" }

dependencies = [
    # Core
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "bm25s>=0.3.11",
    "sqlalchemy>=2.1.1",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "qdrant-client>=1.19.1",
    "greenlet>=3.5.6",
    "beautifulsoup4>=4.15.0",
    "jsonschema>=4.26.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "sentence-transformers>=3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",

]

# ─── Build / package layout ────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/sip"]

# ─── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --tb=short"

# ─── Coverage ──────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/sip"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ─── Ruff (linting + formatting) ───────────────────────────────────────────
[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "RUF", # ruff-specific
]
ignore = [
    "ANN204", # missing return type for __init__
]

[tool.ruff.lint.isort]
known-first-party = ["sip"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
